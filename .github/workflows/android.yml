# Compila la app de Android (APK) y la de Windows (instalador) y las publica juntas en Releases.
# El archivo se sigue llamando android.yml para no reiniciar la numeración de versiones.
name: Compilar y publicar

on:
  push:
    paths:
      - 'youtube-downloader/**'
      - '!youtube-downloader/**/*.md'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    defaults:
      run:
        working-directory: youtube-downloader/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # La clave va cifrada en release.jks.enc; el secreto ANDROID_KEYSTORE_PASSWORD la descifra.
      # (Si existe el secreto ANDROID_KEYSTORE_BASE64, se usa esa clave en su lugar.)
      - name: Preparar la clave de firma
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          elif [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in release.jks.enc \
              -out "$RUNNER_TEMP/release.jks" -pass env:ANDROID_KEYSTORE_PASSWORD
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_PASSWORD. El APK se firma con una clave de prueba y no se publica."
            exit 0
          fi
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Compilar y probar
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      # Nombres fijos: así .../releases/latest/download/Descargador-arm64-v8a.apk siempre da la última versión.
      - name: Nombrar los APK
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$f" "dist/Descargador-$abi.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: youtube-downloader/android/dist/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: youtube-downloader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller pytest

      # ffmpeg (la compilación que recomienda yt-dlp) y deno van dentro del ejecutable.
      - name: Preparar ffmpeg y deno
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force windows/bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg"
          $ffbin = (Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item -Path "$ffbin/ffmpeg.exe", "$ffbin/ffprobe.exe", "$ffbin/*.dll" -Destination windows/bin
          Copy-Item (Get-Command deno).Source windows/bin
          Get-ChildItem windows/bin | Format-Table Name, Length

      - name: Pruebas en Windows
        run: |
          $env:PATH = "$PWD\windows\bin;$env:PATH"
          python -m pytest -q tests

      - name: Crear Descargador.exe
        run: pyinstaller --noconfirm windows/descargador.spec

      - name: Probar Descargador.exe
        run: |
          $env:DESCARGADOR_NO_BROWSER = '1'
          $env:PORT = '5077'
          $app = Start-Process dist/Descargador/Descargador.exe -PassThru
          $status = $null
          for ($i = 0; $i -lt 60 -and -not $status; $i++) {
            Start-Sleep -Seconds 2
            try { $status = Invoke-RestMethod http://127.0.0.1:5077/api/status } catch {}
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $status) { throw 'Descargador.exe no respondió' }
          $status | ConvertTo-Json
          if (-not $status.ffmpeg -or $status.js_runtime -ne 'deno') { throw 'Faltan ffmpeg o deno dentro del ejecutable' }

      - name: Crear el instalador
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup falló' }
          Get-ChildItem dist/*.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: youtube-downloader/dist/DescargadorSetup.exe

  # Solo se publica con la clave de firma de Android y desde la rama principal.
  release:
    needs: [android, windows]
    if: needs.android.outputs.signed == 'true' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "v1.0.${{ github.run_number }}" dist/* \
            --title "Descargador 1.0.${{ github.run_number }}" \
            --notes-file youtube-downloader/release-notes.md \
            --target "${{ github.sha }}" \
            --latest
